<div class=" header pb-6" style="background-color: #931623 !important">
  <div class=" container-fluid">
    <div class=" header-body">
      <div class=" row align-items-center py-4">
      </div>
    </div>
  </div>
</div>



<div class=" container-fluid mt--6">
  <div class=" row">
    <div class=" col">
      <div class="card">
        <div *ngIf="isAble" class="card-header">
          <div class="col-12">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <div>
                <h3 class="mb-0">Documents</h3>
              </div>
            </div>
          </div>
        </div>
        <div class="dataTables_wrapper py-4">
          <div class="row">
            <div class="col-auto">
              <div class="dataTables_length" id="datatable_length">
                <label>
                  <span *ngIf="!isSmallScreen">Show</span>
                  <select name="datatable_length" aria-controls="datatable" class="form-control form-control-sm"
                    (change)="entriesChange($event)">
                    <option value="10" [selected]="entries == 10">10</option>
                    <option value="25" [selected]="entries == 25">25</option>
                    <option value="50" [selected]="entries == 50">50</option>
                    <option value="-1" [selected]="entries == -1">All</option>
                  </select>
                  <span *ngIf="!isSmallScreen">entries</span>
                </label>
              </div>
            </div>

            <div class="col ml--2  custom-flex-end-center">
              <!-- Search Input -->
              <div id="datatable_filter" class="dataTables_filter">
                <label>
                  <input *ngIf="!isSmallScreen || isInputVisible" type="search" class="form-control form-control-sm"
                    placeholder="Search records" aria-controls="datatable" (input)="filterTable($event)" />
                  <i *ngIf="isSmallScreen && !isInputVisible" class="fas fa-search" (click)="toggleSearchInput()"></i>
                </label>
              </div>
              <div id="datatable_filter" class="dataTables_filter mr-2" *ngIf="!isUserRole">
                <!-- Filter Dropdown Button -->
                <div class="btn-group" dropdown>
                  <button id="button-basic" dropdownToggle type="button" class="btn btn-outline-primary dropdown-toggle"
                    aria-controls="dropdown-basic">
                    <span *ngIf="!isSmallScreen">Filters</span>
                    <span class="caret"></span>
                  </button>
                  <ul id="dropdown-basic" *dropdownMenu class="dropdown-menu dropdown-menu-right p-3" role="menu"
                    aria-labelledby="button-basic">
                    <!-- Dropdown for Company -->
                    <li role="menuitem" *ngIf="isRadXRole">
                      <label for="companySelect" class="dropdown-item">Company</label>
                      <select id="companySelect" [(ngModel)]="selectedCompany" class="form-control"
                        (change)="getDocuments()" (click)="$event.stopPropagation()">
                        <option value="">All Companies</option>
                        <option *ngFor="let company of companies" [value]="company.company_id">{{ company.company_name
                          }}</option>
                      </select>
                    </li>

                    <!-- Dropdown for Partner -->
                    <li role="menuitem" *ngIf="isRadXRole || isCompanyRole">
                      <label for="partnerSelect" class="dropdown-item">Partner</label>

                      <!-- Dropdown for RadX Roles -->
                      <select *ngIf="isRadXRole" id="partnerSelect" [(ngModel)]="selectedPartner" class="form-control"
                        (change)="getDocuments()" (click)="$event.stopPropagation()">
                        <option value="" selected>All Partners</option>
                        <option *ngFor="let partner of partners" [value]="partner.partner_id">{{ partner.partner_name
                          }}</option>
                      </select>

                      <!-- Dropdown for Company Roles -->
                      <select *ngIf="isCompanyRole" id="partnerSelect" [(ngModel)]="selectedPartner"
                        class="form-control" (change)="getDocumentsByCompany()" (click)="$event.stopPropagation()">
                        <option value="" selected>All Partners</option>
                        <option *ngFor="let partner of partners" [value]="partner.partner_id">{{ partner.partner_name
                          }}</option>
                      </select>
                    </li>

                    <!-- Dropdown for User Groups -->
                    <li role="menuitem" *ngIf="isRadXRole || isCompanyRole">
                      <label for="userGroupSelect" class="dropdown-item">User Group</label>


                      <select *ngIf="isRadXRole" id="userGroupSelect" [(ngModel)]="selectedUserGroup"
                        class="form-control" (change)="getDocuments()" (click)="$event.stopPropagation()">
                        <option value="">All User Groups</option>
                        <option *ngFor="let userGroup of userGroups" [value]="userGroup.usergr_id">{{
                          userGroup.usergr_name }}</option>
                      </select>

                      <select *ngIf="isCompanyRole" id="userGroupSelect" [(ngModel)]="selectedUserGroup"
                        class="form-control" (change)="getDocumentsByCompany()" (click)="$event.stopPropagation()">
                        <option value="">All User Groups</option>
                        <option *ngFor="let userGroup of userGroups" [value]="userGroup.usergr_id">{{
                          userGroup.usergr_name }}</option>
                      </select>

                    </li>

                    <!-- Dropdown for Users -->
                    <li role="menuitem" *ngIf="!isUserRole">
                      <label for="userSelect" class="dropdown-item">User</label>

                      <select *ngIf="isRadXRole" id="userSelect" [(ngModel)]="selectedUser" class="form-control"
                        (change)="getDocuments()" (click)="$event.stopPropagation()">
                        <option value="">All Users</option>
                        <option *ngFor="let user of users" [value]="user.id">{{ user.name }}</option>
                      </select>

                      <select *ngIf="isCompanyRole" id="userSelect" [(ngModel)]="selectedUser" class="form-control"
                        (change)="getDocumentsByCompany()" (click)="$event.stopPropagation()">
                        <option value="">All Users</option>
                        <option *ngFor="let user of users" [value]="user.id">{{ user.name }}</option>
                      </select>

                      <select *ngIf="isPartnerRole" id="userSelect" [(ngModel)]="selectedUser" class="form-control"
                        (change)="getDocumentsByPartner()" (click)="$event.stopPropagation()">
                        <option value="">All Users</option>
                        <option *ngFor="let user of users" [value]="user.user.id">{{ user.user.name }}</option>
                      </select>

                      <select *ngIf="isUserGroupRole" id="userSelect" [(ngModel)]="selectedUser" class="form-control"
                        (change)="getDocumentsByUserGroup()" (click)="$event.stopPropagation()">
                        <option value="">All Users</option>
                        <option *ngFor="let user of users" [value]="user.user.id">{{ user.user.name }}</option>
                      </select>

                    </li>

                    <li *ngIf="isCompanyRole" role="menuitem">
                      <label class="dropdown-item">From Date</label>
                      <input [(ngModel)]="startDate" (ngModelChange)="getDocumentsByCompany()" type="date"
                        class="form-control mb-2" (click)="$event.stopPropagation()" />

                      <label class="dropdown-item mt-2">To Date</label>
                      <input [(ngModel)]="endDate" (ngModelChange)="getDocumentsByCompany()" type="date"
                        class="form-control" (click)="$event.stopPropagation()" />

                    </li>
                    <li *ngIf="isPartnerRole" role="menuitem">
                      <label class="dropdown-item">From Date</label>
                      <input [(ngModel)]="startDate" (ngModelChange)="getDocumentsByPartner()" type="date"
                        class="form-control mb-2" (click)="$event.stopPropagation()" />

                      <label class="dropdown-item mt-2">To Date</label>
                      <input [(ngModel)]="endDate" (ngModelChange)="getDocumentsByPartner()" type="date"
                        class="form-control" (click)="$event.stopPropagation()" />

                    </li>

                    <li *ngIf="isUserGroupAdmin" role="menuitem">
                      <label class="dropdown-item">From Date</label>
                      <input [(ngModel)]="startDate" (ngModelChange)="getDocumentsByUserGroup()" type="date"
                        class="form-control mb-2" (click)="$event.stopPropagation()" />

                      <label class="dropdown-item mt-2">To Date</label>
                      <input [(ngModel)]="endDate" (ngModelChange)="getDocumentsByUserGroup()" type="date"
                        class="form-control" (click)="$event.stopPropagation()" />

                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>

        </div>
        <!-- <ngx-datatable id="print-section" class="bootstrap selection-cell" [columnMode]="'force'" [headerHeight]="50"
          [footerHeight]="50" [rowHeight]="'auto'" [limit]="entries != -1 ? entries : undefined" [rows]="tempDocuments"
          [selected]="selected" [selectionType]="'multiClick'" (activate)="onActivate($event)">
          <ngx-datatable-column name="Name" prop="file_name"></ngx-datatable-column>
          <ngx-datatable-column *ngIf="!isSmallScreen" name="Date" prop="uploaded_date"></ngx-datatable-column>
          <ngx-datatable-column *ngIf="!isSmallScreen" name="Owner" prop="owner"></ngx-datatable-column>
          <ngx-datatable-column *ngIf="!isSmallScreen" name="Added By" prop="madeBy"></ngx-datatable-column>
          <ngx-datatable-column name="Actions" prop="actions">
            <ng-template ngx-datatable-cell-template let-row="row">
              <button type="button" class=" btn btn-sm btn-neutral" tooltip="Delete"
                [routerLink]="['/assets/documents/delete/', row.document_id]">
                <i class="fas fa-trash-alt"></i></button>
            </ng-template>
          </ngx-datatable-column>
        </ngx-datatable> -->
        <div class="scrollable-table">
          <ngx-datatable id="print-section" class="bootstrap selection-cell" [columnMode]="'force'" [headerHeight]="50"
            [footerHeight]="50" [rowHeight]="'auto'" [limit]="entries != -1 ? entries : undefined"
            [rows]="tempDocuments" [selected]="selected" [selectionType]="'multiClick'" [scrollbarH]="false"
            (activate)="onActivate($event)">

            <ngx-datatable-column name="Name" prop="file_name"></ngx-datatable-column>
            <ngx-datatable-column name="Date" prop="uploaded_date"></ngx-datatable-column>
            <ngx-datatable-column name="Owner" prop="owner"></ngx-datatable-column>
            <ngx-datatable-column name="Added By" prop="madeBy"></ngx-datatable-column>
            <ngx-datatable-column name="Actions" prop="actions">
              <ng-template ngx-datatable-cell-template let-row="row">
                <button type="button" class="btn btn-sm btn-neutral" tooltip="Delete"
                  [routerLink]="['/assets/documents/delete/', row.document_id]">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </ng-template>
            </ngx-datatable-column>

          </ngx-datatable>
        </div>

      </div>
    </div>
  </div>
</div>
