          <ngx-datatable
            id="print-section"
            class="bootstrap selection-cell"
            [columnMode]="'force'"
            [headerHeight]="50"
            [footerHeight]="50"
            [rowHeight]="'auto'"
            [limit]="entries != -1 ? entries : undefined"
            [rows]="temp"
            [selected]="selected"
            [selectionType]="'multiClick'"
            (activate)="onActivate($event)"
            (select)="onSelect($event)"
          >
            <ngx-datatable-column name="VIN" prop="vin_code"></ngx-datatable-column>
            <ngx-datatable-column name="number" prop="vehicle_number"></ngx-datatable-column>
            <ngx-datatable-column name="brand" prop="vehicle_brand"></ngx-datatable-column>
            <ngx-datatable-column name="model" prop="vehicle_model"></ngx-datatable-column>
            <ngx-datatable-column name="year" prop="vehicle_year"></ngx-datatable-column>
            <!-- <ngx-datatable-column name="user"></ngx-datatable-column> -->
            <ngx-datatable-column name="timeCreated" prop="created_time"></ngx-datatable-column>
          </ngx-datatable>
        </div>
      </div>
