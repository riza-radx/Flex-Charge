<div class=" header pb-6" style="background-color: #931623 !important">
    <div class="container-fluid">
      <div class="header-body">
        <div class="row align-items-center py-4">
          <div class="col-lg-6 col-7">
            <h3 class="h2 text-white d-inline-block mb-0">User Group</h3>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="container-fluid mt--6">
    <div class="row">
      <div class="col">
        <div class="card">
          <div class="card-header">
            <h3 class="mb-0">Create User Group</h3>
          </div>
          <div class="card-body">
            <form (ngSubmit)="onSubmit()">
              <div class="form-group row">
                <label class="col-md-2 col-form-label form-control-label" for="name">Name</label>
                <div class="col-md-10">
                  <input class="form-control" id="name" [(ngModel)]="userGroup.usergr_name" name="usergr_name" required />
                </div>
              </div>
  
              <div class="form-group row">
                <label class="col-md-2 col-form-label form-control-label" for="description">Description</label>
                <div class="col-md-10">
                  <input class="form-control" id="description" [(ngModel)]="userGroup.usergr_description" name="usergr_description" required />
                </div>
              </div>
  
              <div class="form-group row">
                <label class="col-md-2 col-form-label form-control-label" for="address">Address</label>
                <div class="col-md-10">
                  <input class="form-control" id="address" [(ngModel)]="userGroup.usergr_addres" name="usergr_addres" required />
                </div>
              </div>
  
              <div class="form-group row">
                <label class="col-md-2 col-form-label form-control-label" for="city">City</label>
                <div class="col-md-10">
                  <input class="form-control" id="city" [(ngModel)]="userGroup.usergr_city" name="usergr_city" required />
                </div>
              </div>
  
              <div class="form-group row">
                <label class="col-md-2 col-form-label form-control-label" for="country">Country</label>
                <div class="col-md-10">
                  <input class="form-control" id="country" [(ngModel)]="userGroup.usergr_country" name="usergr_country" required />
                </div>
              </div>
  
              <div class="form-group row">
                <label class="col-md-2 col-form-label form-control-label" for="phone_no">Phone Number</label>
                <div class="col-md-10">
                  <input class="form-control" id="phone_no" type="tel" [(ngModel)]="userGroup.usergr_phone_no" name="usergr_phone_no" required />
                </div>
              </div>
  
              <div class="form-group row">
                <label class="col-md-2 col-form-label form-control-label" for="email">Email</label>
                <div class="col-md-10">
                  <input class="form-control" id="email" type="email" [(ngModel)]="userGroup.usergr_email" name="usergr_email" required />
                </div>
              </div>
  
              <div class="form-group row">
                <label class="col-md-2 col-form-label form-control-label" for="company_id">Company ID</label>
                <div class="col-md-10">
                  <input class="form-control" id="company_id" [(ngModel)]="userGroup.company_id" name="company_id" required />
                </div>
              </div>
  
              <div class="form-group row">
                <div class="col-md-10 offset-md-2">
                  <button class="btn btn-primary" type="submit">Create User Group</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
