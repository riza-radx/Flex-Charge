<div class="login-container"  style="background-image: url('assets/flexcharge/login-background.jpeg'); background-size: cover;">
    <!-- Left side with logo -->
  
  
    <div *ngIf="!isSmallScreen" class="login-logo" style="background-color: #ffffff00;">
      <!-- <img src="assets/flexcharge/login-background.jpeg" alt="RADX Logo" class="logo-image" /> -->
      <img src="assets/flexcharge/logo.png" alt="Flex Charge" class="logo-image" />
    </div>
  
    <!-- Right side with Reset password form -->
    <div *ngIf="isSmallScreen || true" class="login-form">
      <div class="card bg-gradient-secondary border-0 mb-0">
        <div class="card-body px-lg-5 py-lg-5">
          <h2 class="text-center mb-4">Reset PASSWORD</h2>

          <form role="form" (ngSubmit)="resetPassword()">
            <div class="form-group mb-3">
              <div class="input-group input-group-alternative">
                <input class="form-control" placeholder="Password" type="password" [(ngModel)]="newPassword" name="newPassword" required
                  (focus)="focus = true" (blur)="focus = false" />
              </div>
            </div>
  
            <!-- <div class="d-flex justify-content-between align-items-center">
              <a href="javascript:void(0)" class="text-dark">Reset password?</a>
            </div> -->
  
            <div class="text-center">
              <button type="submit" class="btn btn-primary mt-4">Submit</button>
            </div>
          </form>
  
          <!-- Success Message -->
          <!-- <div *ngIf="emailSentMessage" class="alert alert-success mt-3" style="background-color: #d4edda; color: #155724;">
            {{ emailSentMessage }}
          </div> -->
  
          <!-- Error Message -->
          <div *ngIf="errorMessage" class="alert alert-danger mt-3" style="background-color: #ffcccc; color: #660000;">
            {{ errorMessage }}
          </div>
        </div>
  
        <div class="text-center mt-3">
          <a [routerLink]="['/login']" class="text-dark">Back to login</a>
        </div>
      </div>
    </div>
  </div>
  
  
  
  <style>
    /* Container for the login page layout */
    .login-container {
      display: flex;
      height: 100vh;
      align-items: center;
      background: linear-gradient(to right, #e8f1f6, #ffffff);
    }
  
    /* Left column for the logo */
    .login-logo {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8f1f6;
      padding: 2rem;
    }
  
    .logo-image {
      max-width: 60%;
    }
  
    /* Right column for the form */
    .login-form {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
  
    .card {
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      background-color: #ffffff;
    }
  
    h2 {
      color: #333;
      font-weight: 600;
    }
  
    .form-control {
      border-radius: 4px;
      box-shadow: none;
      border: 1px solid #ddd;
      font-size: 1rem;
    }
  
    .btn-primary {
      background-color: #2c3e44;
      border-color: #2c3e44;
      font-size: 1rem;
      font-weight: 500;
      width: 100%;
    }
  
    .btn-primary:hover {
      background-color: #2c3e44;
      border-color: #2c3e44;
    }
  
    .text-dark {
      color: #333 !important;
      font-size: 0.9rem;
    }
  </style>
