<div class="modal-header">
    <h2 class="modal-title">Enter Verification Code</h2>
  </div>
  <div class="modal-body">
    <p>A verification code has been sent to your phone. Please enter it below:</p>
    
    <div class="form-group">
      <label for="verificationCode">Verification Code</label>
      <input type="text" id="verificationCode" class="form-control" [(ngModel)]="verificationCode" placeholder="Enter code" maxlength="6">
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
    <button type="button" class="btn btn-primary" [disabled]="!verificationCode" (click)="verifyCode()">
      Verify
    </button>
  </div>
