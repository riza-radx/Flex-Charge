<div class=" header pb-6" style="background-color: #931623 !important">
    <div class="container-fluid">
        <div class="header-body">
            <div class="row align-items-center py-4">
                <div class="col-lg-6 col-7">
                    <h3 class="h2 text-white d-inline-block mb-0">Create Partner</h3>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid mt--6">
    <div class="row">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0">Create Partner</h3>
                </div>
                <div class="card-body">
                    <form (ngSubmit)="onSubmit()">
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="partnerName">Partner Name</label>
                            <div class="col-md-10">
                                <input class="form-control" id="partnerName" [(ngModel)]="partner.partnerName" name="partnerName" required />
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="address">Address</label>
                            <div class="col-md-10">
                                <input class="form-control" id="address" [(ngModel)]="partner.address" name="address" required />
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="city">City</label>
                            <div class="col-md-10">
                                <input class="form-control" id="city" [(ngModel)]="partner.city" name="city" required />
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="phoneNumber">Phone Number</label>
                            <div class="col-md-10">
                                <input class="form-control" id="phoneNumber" type="tel" [(ngModel)]="partner.phoneNumber" name="phoneNumber" required />
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="email">Email</label>
                            <div class="col-md-10">
                                <input class="form-control" id="email" type="email" [(ngModel)]="partner.email" name="email" required />
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="nipt">NIPT</label>
                            <div class="col-md-10">
                                <input class="form-control" id="nipt" [(ngModel)]="partner.nipt" name="nipt" required />
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="companyId">Company ID</label>
                            <div class="col-md-10">
                                <input class="form-control" id="companyId" [(ngModel)]="partner.companyId" name="companyId" required />
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="userId">User ID</label>
                            <div class="col-md-10">
                                <input class="form-control" id="userId" [(ngModel)]="partner.userId" name="userId" required />
                            </div>
                        </div>

                        <div class="form-group row">
                            <div class="col-md-10 offset-md-2">
                                <button class="btn btn-primary" type="submit">Create Partner</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
