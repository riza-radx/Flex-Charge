<div class=" header pb-6" style="background-color: #931623 !important">
    <div class="container-fluid">
        <div class="header-body">
            <div class="row align-items-center py-4">
                <div class="col-lg-6 col-7">
                    <h3 class="h2 text-white d-inline-block mb-0">Create Voucher</h3>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid mt--6">
    <div class="row">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0">Create Voucher</h3>
                </div>
                <div class="card-body">
                    <form (ngSubmit)="onSubmit()">
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="voucherName">Voucher Name</label>
                            <div class="col-md-10">
                                <input class="form-control" id="voucherName" [(ngModel)]="voucher.voucherName" name="voucherName" required />
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="voucherDescription">Voucher Description</label>
                            <div class="col-md-10">
                                <input class="form-control" id="voucherDescription" [(ngModel)]="voucher.voucherDescription" name="voucherDescription" required />
                            </div>
                        </div>

                        <!-- Checkbox to toggle between amount and percentage -->
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="useAmount">Use Amount</label>
                            <div class="col-md-10">
                                <input type="checkbox" id="useAmount" (change)="toggleUseAmount($event)" />
                            </div>
                        </div>

                        <!-- Amount field, only enabled when useAmount is true -->
                        <div class="form-group row" *ngIf="useAmount">
                            <label class="col-md-2 col-form-label form-control-label" for="amount">Amount</label>
                            <div class="col-md-10">
                                <input class="form-control" id="amount" type="number" [(ngModel)]="voucher.amount" name="amount" required />
                            </div>
                        </div>

                        <!-- Percentage field, only enabled when useAmount is false -->
                        <div class="form-group row" *ngIf="!useAmount">
                            <label class="col-md-2 col-form-label form-control-label" for="percentage">Percentage</label>
                            <div class="col-md-10">
                                <input class="form-control" id="percentage" type="number" [(ngModel)]="voucher.percentage" name="percentage" required />
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="companyId">Company ID</label>
                            <div class="col-md-10">
                                <input class="form-control" id="companyId" [(ngModel)]="voucher.companyId" name="companyId" required />
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="userId">User ID</label>
                            <div class="col-md-10">
                                <input class="form-control" id="userId" [(ngModel)]="voucher.userId" name="userId" required />
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="date">Date</label>
                            <div class="col-md-10">
                                <input class="form-control" id="date" type="date" [(ngModel)]="voucher.date" name="date" required />
                            </div>
                        </div>

                        <!-- 🆕 Distributor Voucher (informacion) -->
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label">Voucher Distributori</label>
                            <div class="col-md-10">
                                <input type="checkbox" id="is_distributor_card"
                                    [(ngModel)]="voucher.is_distributor_card" name="is_distributor_card" />
                                <small class="text-muted ml-2 d-block">
                                    Shenjo nese voucher-i lëshohet te një distributor. Vetëm informacion — nuk ndryshon logjikën.
                                </small>
                            </div>
                        </div>

                        <div class="form-group row" *ngIf="voucher.is_distributor_card">
                            <label class="col-md-2 col-form-label form-control-label" for="distributor_name">Emri i Distributorit</label>
                            <div class="col-md-10">
                                <input class="form-control" id="distributor_name"
                                    [(ngModel)]="voucher.distributor_name" name="distributor_name"
                                    placeholder="psh ABC Distribution Ltd" />
                            </div>
                        </div>

                        <div class="form-group row">
                            <div class="col-md-10 offset-md-2">
                                <button class="btn btn-primary" type="submit">Create Voucher</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
