<div class=" header pb-6" style="background-color: #931623 !important">
    <div class="container-fluid">
        <div class="header-body">
            <div class="row align-items-center py-4">
            </div>
        </div>
    </div>
</div>

<div class="container-fluid mt--6">
    <div class="row">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0">Create Promo</h3>
                </div>
                <div class="card-body">
                    <form #promoForm="ngForm" (ngSubmit)="onSubmit()" novalidate>
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="promoName">Promo Name</label>
                            <div class="col-md-10">
                                <input class="form-control" id="promoName" [(ngModel)]="promo.promoName"
                                    name="promoName" required />
                                <small
                                    *ngIf="promoForm.controls.promoName?.invalid && (promoForm.controls.promoName?.touched || promoForm.submitted)"
                                    class="text-danger">
                                    Promo Name is required.
                                </small>
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="promoCode">Promo Code</label>
                            <div class="col-md-10">
                                <input class="form-control" id="promoCode" [(ngModel)]="promo.promoCode"
                                    name="promoCode" required />
                                <small
                                    *ngIf="promoForm.controls.promoCode?.invalid && (promoForm.controls.promoCode?.touched || promoForm.submitted)"
                                    class="text-danger">
                                    Promo Code is required.
                                </small>
                            </div>
                        </div>

                        <!-- <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="useAmount">Use Amount</label>
                            <div class="col-md-10">
                                <input type="checkbox" id="useAmount" [(ngModel)]="useAmount" name="useAmount"
                                    (change)="toggleUseAmount()" />
                            </div>
                        </div> -->

                                <input class="form-control" id="percentage" type="number" [(ngModel)]="promo.percentage"

                                <small
                                    *ngIf="promoForm.controls.percentage?.invalid && !useAmount && (promoForm.controls.percentage?.touched || promoForm.submitted)"

                                    Percentage is required if "Use Amount" is not checked.
                                </small>
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="amount">Amount</label>
                            <div class="col-md-10">
                                <input class="form-control" id="amount" type="number" [(ngModel)]="promo.amount"
                                    name="amount" [disabled]="!useAmount" [required]="useAmount" />
                                <small
                                    *ngIf="promoForm.controls.amount?.invalid && useAmount && (promoForm.controls.amount?.touched || promoForm.submitted)"
                                    class="text-danger">
                                    Amount is required if "Use Amount" is checked.
                                </small>
                            </div>
                        </div> -->
                        <!-- Rate -->
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label" for="rateId">Rate</label>
                            <div class="col-md-10">
                                <select class="form-control" id="rateId" [(ngModel)]="promo.rateId" name="rateId"
                                    required>
                                    <option value="">Select Rate</option>
                                    <option *ngFor="let rate of rates" [value]="rate.rate_id">{{ rate.rate_name }}
                                    </option>
                                </select>
                                <small
                                    *ngIf="promoForm.controls.rateId?.invalid && (promoForm.controls.rateId?.touched || promoForm.submitted)"
                                    class="text-danger">Rate is required.</small>
                            </div>
                        </div>

                        <!-- Offer Charging Count -->
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="offerChargingCount">Offer
                                Charging Count</label>
                            <div class="col-md-10">
                                <input class="form-control" id="offerChargingCount" type="number"
                                    [(ngModel)]="promo.offerChargingCount" name="offerChargingCount" />
                            </div>
                        </div>

                        <!-- Offer Charging Energy -->
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="offerChargingEnergy">Offer
                                Charging Energy
                                (kWh)</label>
                            <div class="col-md-10">
                                <input class="form-control" id="offerChargingEnergy" type="number" step="0.01"
                                    [(ngModel)]="promo.offerChargingEnergy" name="offerChargingEnergy" />
                            </div>
                        </div>

                        <!-- Time Period -->
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="timePeriod">Time
                                Period</label>
                            <div class="col-md-10">
                                <select class="form-control" id="timePeriod" [(ngModel)]="promo.timePeriod"
                                    name="timePeriod">
                                    <option value="">Select Time Period</option>
                                    <option value="daily">Daily</option>
                                    <option value="weekly">Weekly</option>
                                    <option value="monthly">Monthly</option>
                                    <option value="yearly">Yearly</option>
                                </select>
                            </div>
                        </div>

                        <!-- User Role -->
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="userRole">
                                User Role
                            </label>
                            <div class="col-md-10">
                                <select class="form-control" id="userRole" [(ngModel)]="promo.userRole" name="userRole">
                                    <option value="" disabled selected>Select a user role</option>
                                    <option value="COMPANY_USER">Company User</option>
                                    <option value="USER_GROUP_USER">User Group User</option>
                                    <option value="PARTNER_USER">Partner User</option>
                                </select>
                            </div>
                        </div>


                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="companyId">Company</label>
                            <div class="col-md-10">
                                <input type="text" class="form-control" id="companyId" [value]="company_name"
                                    [readonly]="true" />
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="isEnabled">Is Enabled</label>
                            <div class="col-md-10">
                                <input type="checkbox" id="isEnabled" [(ngModel)]="promo.isEnabled" name="isEnabled" />
                            </div>
                        </div>

                        <div class="form-group row">
                            <div class="col-md-10 offset-md-2">
                                <button class="btn btn-primary" type="submit">Create
                                    Promo</button>
                            </div>
                        </div>
                    </form>
                    <div *ngIf="errorMessage" class="alert alert-danger mt-3"
                        style="background-color: #ffcccc; color: #660000;">{{ errorMessage }}</div>
                </div>
            </div>
        </div>
    </div>
</div>
