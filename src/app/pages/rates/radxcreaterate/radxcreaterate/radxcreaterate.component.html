<div class=" header pb-6" style="background-color: #931623 !important">
    <div class="container-fluid">
        <div class="header-body">
            <div class="row align-items-center py-4">
            </div>
        </div>
    </div>
</div>

<div class="container-fluid mt--6">
    <div class="row">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0">Create Rate</h3>
                </div>
                <div class="card-body">
                    <form (ngSubmit)="onSubmit()" #rateForm="ngForm" novalidate>
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="name">Name</label>
                            <div class="col-md-10">
                                <input class="form-control" id="name" [(ngModel)]="rate.name" name="name" required />
                                <small
                                    *ngIf="rateForm.controls.name?.invalid && (rateForm.controls.name?.touched || rateForm.submitted)"
                                    class="text-danger">
                                    Name is required.
                                </small>
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="companyId">Company</label>
                            <div class="col-md-10">
                                <input type="text" class="form-control" id="companyId" [value]="company?.company_name"
                                    [readonly]="true" />
                            </div>
                        </div>

                        <!-- <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="defaultPrice">Default
                                Price</label>
                            <div class="col-md-10">
                                <input class="form-control" id="defaultPrice" type="number"
                                    [(ngModel)]="rate.defaultPrice" name="defaultPrice" required />
                                <small
                                    *ngIf="rateForm.controls.defaultPrice?.invalid && (rateForm.controls.defaultPrice?.touched || rateForm.submitted)"
                                    class="text-danger">
                                    Default Price is required.
                                </small>
                            </div>
                        </div> -->

                        <!-- <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label"
                                for="percentage">Percentage</label>
                            <div class="col-md-10">
                                <input class="form-control" id="percentage" type="number" [(ngModel)]="rate.percentage"
                                    name="percentage" required />
                                <small
                                    *ngIf="rateForm.controls.percentage?.invalid && (rateForm.controls.percentage?.touched || rateForm.submitted)"
                                    class="text-danger">
                                    Percentage is required.
                                </small>
                            </div>
                        </div> -->

                        <!-- 🆕 Rate Type: Sale (default) ose Purchase (Blerje) -->
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="rate_type">Rate Type</label>
                            <div class="col-md-10">
                                <select class="form-control" id="rate_type"
                                    [(ngModel)]="rate.rate_type" name="rate_type"
                                    (change)="rate.rate_type === 'sale' ? (rate.purchase_category = null) : (rate.purchase_category = rate.purchase_category || 'ACTIVE')">
                                    <option value="sale">Sale (Rate Shitje)</option>
                                    <option value="purchase">Purchase (Rate Blerje)</option>
                                </select>
                                <small class="text-muted d-block mt-1">
                                    Sale: rate qe u aplikohet karikimeve (cmimi i shitjes).
                                    Purchase: rate i blerjes se energjise per set te charger-ave.
                                </small>
                            </div>
                        </div>

                        <!-- 🆕 Purchase Category (vetem per Purchase) -->
                        <div class="form-group row" *ngIf="rate.rate_type === 'purchase'">
                            <label class="col-md-2 col-form-label form-control-label" for="purchase_category">Purchase Category</label>
                            <div class="col-md-10">
                                <select class="form-control" id="purchase_category"
                                    [(ngModel)]="rate.purchase_category" name="purchase_category" required>
                                    <option value="ACTIVE">ACTIVE (jashte pikut)</option>
                                    <option value="PIK">PIK (ne oraret pik)</option>
                                </select>
                            </div>
                        </div>

                        <!-- 🆕 Set as Default — kur ka shume rate per kompani, ky perdoret si fallback -->
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="isDefault">Set as Default</label>
                            <div class="col-md-10 d-flex align-items-center">
                                <input class="form-check-input" id="isDefault" type="checkbox" [(ngModel)]="rate.isDefault" name="isDefault" style="margin-right:8px;" />
                                <small class="text-muted">Nese check, ky rate perdoret kur user/charger nuk kane rate te dedikuar. Vetem 1 default per kompani.</small>
                            </div>
                        </div>

                        <div class="form-group row">
                            <div class="col-md-10 offset-md-2">
                                <button class="btn btn-primary" type="submit">Create
                                    Rate</button>
                            </div>
                        </div>

                        <div *ngIf="errorMessage" class="alert alert-danger mt-3"   style="background-color: #ffcccc; color: #660000;">{{ errorMessage }}</div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
