<div class=" header pb-6" style="background-color: #931623 !important">
  <div class="container-fluid">
    <div class="header-body">
      <div class="row align-items-center py-4">
      </div>
    </div>
  </div>
</div>

<div class="container-fluid mt--6">
  <div class="row">
    <div class="col">
      <div class="card">
        <div class="card-header">
          <h3 class="mb-0">Update Promo</h3>
        </div>
        <div class="card-body">
          <form [formGroup]="promoForm" (ngSubmit)="onSubmit()">
            <div class="form-group row">
              <label class="col-md-2 col-form-label form-control-label" for="promoName">Promo Name</label>
              <div class="col-md-10">
                <input class="form-control" id="promoName" formControlName="promoName" required />
                <small *ngIf="promoForm.get('promoName')?.invalid && promoForm.get('promoName')?.touched"
                  class="text-danger">
                  Promo Name is required.
                </small>
              </div>
            </div>

            <div class="form-group row">
              <label class="col-md-2 col-form-label form-control-label" for="promoCode">Promo Code</label>
              <div class="col-md-10">
                <input class="form-control" id="promoCode" formControlName="promoCode" required />
                <small *ngIf="promoForm.get('promoCode')?.invalid && promoForm.get('promoCode')?.touched"
                  class="text-danger">
                  Promo Code is required.
                </small>
              </div>
            </div>

            <!-- <div class="form-group row">
              <label class="col-md-2 col-form-label form-control-label" for="percentage">Percentage</label>
              <div class="col-md-10">
                <input class="form-control" id="percentage" formControlName="percentage" required />
                <small *ngIf="promoForm.get('percentage')?.invalid && promoForm.get('percentage')?.touched"
                  class="text-danger">
                  Percentage is required.
                </small>
              </div>
            </div> -->

            <!-- Rate -->
            <div class="form-group row">
              <label class="col-md-2 col-form-label form-control-label" for="rateId">Rate</label>
              <div class="col-md-10">
                <select class="form-control" id="rateId" formControlName="rateId" required>
                  <option value="">Select Rate</option>
                  <option *ngFor="let rate of rates" [value]="rate.rate_id">
                    {{ rate.rate_name }}
                  </option>
                </select>
                <small *ngIf="promoForm.get('rateId')?.invalid && promoForm.get('rateId')?.touched"
                  class="text-danger">Rate is required.</small>
              </div>
            </div>

            <!-- Offer Charging Count -->
            <div class="form-group row">
              <label class="col-md-2 col-form-label form-control-label" for="offerChargingCount">Offer Charging
                Count</label>
              <div class="col-md-10">
                <input class="form-control" id="offerChargingCount" type="number"
                  formControlName="offerChargingCount" />
              </div>
            </div>

            <!-- Offer Charging Energy -->
            <div class="form-group row">
              <label class="col-md-2 col-form-label form-control-label" for="offerChargingEnergy">
                Offer Charging Energy (kWh)
              </label>
              <div class="col-md-10">
                <input class="form-control" id="offerChargingEnergy" type="number" step="0.01"
                  formControlName="offerChargingEnergy" />
              </div>
            </div>

            <!-- Time Period -->
            <div class="form-group row">
              <label class="col-md-2 col-form-label form-control-label" for="timePeriod">Time Period</label>
              <div class="col-md-10">
                <select class="form-control" id="timePeriod" formControlName="timePeriod">
                  <option value="">Select Time Period</option>
                  <option value="daily">Daily</option>
                  <option value="weekly">Weekly</option>
                  <option value="monthly">Monthly</option>
                  <option value="yearly">Yearly</option>
                </select>
              </div>
            </div>

            <!-- User Role -->
            <div class="form-group row">
              <label class="col-md-2 col-form-label form-control-label" for="userRole">User Role</label>
              <div class="col-md-10">
                <select class="form-control" id="userRole" formControlName="userRole">
                  <option value="" disabled>Select a user role</option>
                  <option value="COMPANY_USER">Company User</option>
                  <option value="USER_GROUP_USER">User Group User</option>
                  <option value="PARTNER_USER">Partner User</option>
                </select>
              </div>
            </div>
            <!-- <div class="form-group row">
              <label class="col-md-2 col-form-label form-control-label" for="companyId">Company</label>
              <div class="col-md-10">
                <select class="form-control" id="companyId" formControlName="companyId" required>
                  <option value="">Select a company</option>
                  <option *ngFor="let company of companies" [value]="company.company_id">{{ company.company_name }}
                  </option>
                </select>
                <small *ngIf="promoForm.get('companyId')?.invalid && promoForm.get('companyId')?.touched"
                  class="text-danger">
                  Company selection is required.
                </small>
              </div>
            </div> -->
            <div class="form-group row">
              <label class="col-md-2 col-form-label form-control-label" for="companyId">Company</label>
              <div class="col-md-10">
                <input type="text" class="form-control" id="companyId" [value]="company_name" [readonly]="true" />
              </div>
            </div>

            <div class="form-group row">
              <label class="col-md-2 col-form-label form-control-label" for="isEnabled">Is Enabled</label>
              <div class="col-md-10">
                <input type="checkbox" id="isEnabled" formControlName="isEnabled" />
              </div>
            </div>

            <div class="form-group row">
              <div class="col-md-10 offset-md-2">
                <button class="btn btn-primary" type="submit">Update Promo</button>
              </div>
            </div>
          </form>
          <div *ngIf="errorMessage" class="alert alert-danger mt-3" style="background-color: #ffcccc; color: #660000;">
            {{ errorMessage }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
