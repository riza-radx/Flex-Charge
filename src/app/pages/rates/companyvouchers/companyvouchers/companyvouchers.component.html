<div class=" container-fluid mt--6">
  <div class=" row">
    <div class=" col">
      <div class="card">
        <!-- Card header -->
        <div class="card-header">
          <h3 class="mb-0">Selecting Rows</h3>
          <p class="text-sm mb-0">
            This is an exmaple of datatable using the well known ngx-datatable
            plugin. This is a minimal setup in order to get started fast.
          </p>
        </div>
        <div class="dataTables_wrapper py-4">
          <div class="row">
            <div class="col-sm-12 col-md-6">
              <div class="dataTables_length" id="datatable_length">
                <label>
                  Show
                  <select
                    name="datatable_length"
                    aria-controls="datatable"
                    class="form-control form-control-sm"
                    (change)="entriesChange($event)"
                  >
                    <option value="10" [selected]="entries == 10">10</option>
                    <option value="25" [selected]="entries == 25">25</option>
                    <option value="50" [selected]="entries == 50">50</option>
                    <option value="-1" [selected]="entries == -1">All</option>
                  </select>
                  entries
                </label>
              </div>
            </div>
            <div class="col-sm-12 col-md-6">
              <div id="datatable_filter" class="dataTables_filter">
                <label>
                  <input
                    type="search"
                    class="form-control form-control-sm"
                    placeholder="Search records"
                    aria-controls="datatable"
                    (keyup)="filterTable($event)"
                  />
                </label>
              </div>
            </div>
          </div>

          <!-- <ngx-datatable
            id="print-section"
            class="bootstrap selection-cell"
            [columnMode]="'force'"
            [headerHeight]="50"
            [footerHeight]="50"

            [rows]="temp"
            [selected]="selected"
            [selectionType]="'multiClick'"
            (activate)="onActivate($event)"
            (select)="onSelect($event)"
          >
            <ngx-datatable-column name="Name"></ngx-datatable-column>
            <ngx-datatable-column name="Position"></ngx-datatable-column>
            <ngx-datatable-column name="Office"></ngx-datatable-column>
            <ngx-datatable-column name="Age"></ngx-datatable-column>
            <ngx-datatable-column name="Start"></ngx-datatable-column>
            <ngx-datatable-column name="Salary"></ngx-datatable-column>
          </ngx-datatable> -->
          <ngx-datatable
            id="print-section"
            class="bootstrap selection-cell"
            [columnMode]="'force'"
            [headerHeight]="50"
            [footerHeight]="50"
            [rowHeight]="'auto'"
            [limit]="entries != -1 ? entries : undefined"
            [rows]="temp"
            [selected]="selected"
            [selectionType]="'multiClick'"
            (activate)="onActivate($event)"
            (select)="onSelect($event)"
          >
            <ngx-datatable-column name="Voucher ID" prop="voucher_id"></ngx-datatable-column>
            <ngx-datatable-column name="Voucher Name" prop="voucher_name"></ngx-datatable-column>
            <ngx-datatable-column name="Description" prop="voucher_description"></ngx-datatable-column>
            <ngx-datatable-column name="Amount" prop="amount"></ngx-datatable-column>
            <ngx-datatable-column name="Serial No" prop="serial_no"></ngx-datatable-column>
            <ngx-datatable-column name="Block No" prop="block_no"></ngx-datatable-column>
            <ngx-datatable-column name="Company ID" prop="company_id"></ngx-datatable-column>
            <ngx-datatable-column name="User ID" prop="user_id"></ngx-datatable-column>
            <ngx-datatable-column name="Expire Date" prop="expire_date"></ngx-datatable-column>
          </ngx-datatable>
        </div>
      </div>
    </div>
  </div>
</div>
