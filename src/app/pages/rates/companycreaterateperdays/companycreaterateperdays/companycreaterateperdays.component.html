<div class=" header pb-6" style="background-color: #931623 !important">
    <div class="container-fluid">
        <div class="header-body">
            <div class="row align-items-center py-4">
                <div class="col-lg-6 col-7">
                    <h3 class="h2 text-white d-inline-block mb-0">Create Rate Per Days</h3>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid mt--6">
    <div class="row">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0">Create Rate Per Days</h3>
                </div>
                <div class="card-body">
                    <form (ngSubmit)="onSubmit()">
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="day">Day</label>
                            <div class="col-md-10">
                                <input class="form-control" id="day" [(ngModel)]="ratePerDays.day" name="day" required />
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="time">Time</label>
                            <div class="col-md-10">
                                <input class="form-control" id="time" [(ngModel)]="ratePerDays.time" name="time" required />
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="month">Month</label>
                            <div class="col-md-10">
                                <input class="form-control" id="month" [(ngModel)]="ratePerDays.month" name="month" required />
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="year">Year</label>
                            <div class="col-md-10">
                                <input class="form-control" id="year" [(ngModel)]="ratePerDays.year" name="year" required />
                            </div>
                        </div>

                        <!-- <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="userId">User ID</label>
                            <div class="col-md-10">
                                <input class="form-control" id="userId" [(ngModel)]="ratePerDays.userId" name="userId" required />
                            </div>
                        </div> -->
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="userId">User</label>
                            <div class="col-md-10">
                              <select class="form-control" id="userId" [(ngModel)]="ratePerDays.userId" name="userId" required>
                                <option *ngFor="let user of users" [value]="user.id">
                                  {{ user.name }}
                                </option>
                              </select>
                            </div>
                          </div>

                        <!-- <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="userGroupId">User Group ID</label>
                            <div class="col-md-10">
                                <input class="form-control" id="userGroupId" [(ngModel)]="ratePerDays.userGroupId" name="userGroupId" required />
                            </div>
                        </div> -->
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="userGroupId">User Group</label>
                            <div class="col-md-10">
                              <select class="form-control" id="userGroupId" [(ngModel)]="ratePerDays.userGroupId" name="userGroupId" required>
                                <option *ngFor="let userGroup of userGroups" [value]="userGroup.usergr_id">
                                  {{ userGroup.usergr_name }}
                                </option>
                              </select>
                            </div>
                          </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="dayCreated">Day Created</label>
                            <div class="col-md-10">
                                <input class="form-control" id="dayCreated" [(ngModel)]="ratePerDays.dayCreated" name="dayCreated" required />
                            </div>
                        </div>

                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="createdBy">Created By</label>
                            <div class="col-md-10">
                                <input class="form-control" id="createdBy" [(ngModel)]="ratePerDays.createdBy" name="createdBy" required />
                            </div>
                        </div>

                        <div class="form-group row">
                            <div class="col-md-10 offset-md-2">
                                <button class="btn btn-primary" type="submit">Create Rate Per Days</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
