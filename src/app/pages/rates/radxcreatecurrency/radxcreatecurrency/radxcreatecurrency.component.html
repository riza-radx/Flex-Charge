<div class=" header pb-6" style="background-color: #931623 !important">
    <div class="container-fluid">
        <div class="header-body">
            <div class="row align-items-center py-4">
            </div>
        </div>
    </div>
</div>

<div class="container-fluid mt--6">
    <div class="row">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0">Create Currency</h3>
                </div>
                <div class="card-body">
                    <form #currencyForm="ngForm" (ngSubmit)="onSubmit()" novalidate>
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="currencyName">Currency
                                Name</label>
                            <div class="col-md-10">
                                <input class="form-control" id="currencyName" [(ngModel)]="currency.currencyName"
                                    name="currencyName" required />
                                <small
                                    *ngIf="currencyForm.controls.currencyName?.invalid && (currencyForm.controls.currencyName?.touched || currencyForm.submitted)"
                                    class="text-danger">
                                    Currency Name is required.
                                </small>
                            </div>
                        </div>

                        <!-- <div *ngIf="isRadXRole" class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="companyId">Company
                                Name</label>
                            <div class="col-md-10">
                                <select class="form-control" id="companyId" [(ngModel)]="currency.companyId"
                                    name="companyId">
                                    <option value="" >Select a company</option>
                                    <option *ngFor="let company of companies" [value]="company.company_id">
                                        {{ company.company_name }}
                                    </option>
                                </select>

                            </div>
                        </div> -->

                        <div class="form-group row">
                            <div class="col-md-10 offset-md-2">
                                <button class="btn btn-primary" type="submit">Create
                                    Currency</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
