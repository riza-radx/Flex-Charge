<div class=" header pb-6" style="background-color: #931623 !important">
  <div class=" container-fluid">
    <div class=" header-body">
      <div class=" row align-items-center py-4">
      </div>
    </div>
  </div>
</div>

<div class=" container-fluid mt--6">
  <div class=" row">
    <div class=" col">
      <div class="card">
        <div class="card-header">
          <div class="col-12">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <div>
                <h3 class="mb-0">Taxes</h3>
                <!-- todo : Adding the function for counting the new entries-->
                <!-- <p *ngIf="isRadXRole" class="text-sm mb-0">✓ {{ currentMonthCountEntry }} New Taxes this month</p> -->
              </div>

              <div class="btn-group">
                <button *ngIf="!isCompanyAnalyst" type="button" class="btn btn-icon-clipboard btn-outline-primary" tooltip="Add New Tax">
                  <a [routerLink]="['/rates/radxcreatetaxes']">
                    <i class="fas fa-plus-square"></i>
                  </a>
                </button>
                <button (click)="exportToPDF()" type="button" class="btn btn-icon-clipboard btn-outline-primary"
                  tooltip="Export to PDF">
                  <i class="fas fa-file-pdf"></i>
                </button>
                <button (click)="exportToExcel()" type="button" class="btn btn-icon-clipboard btn-outline-primary"
                  tooltip="Export to Excel">
                  <i class="fas fa-file-excel"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="dataTables_wrapper py-4">
          <div class="row">
            <div class="col-auto">
              <div class="dataTables_length" id="datatable_length">
                <label>
                  <span *ngIf="!isSmallScreen">Show</span>
                  <select name="datatable_length" aria-controls="datatable" class="form-control form-control-sm"
                    (change)="entriesChange($event)">
                    <option value="10" [selected]="entries == 10">10</option>
                    <option value="25" [selected]="entries == 25">25</option>
                    <option value="50" [selected]="entries == 50">50</option>
                    <option value="-1" [selected]="entries == -1">All</option>
                  </select>
                  <span *ngIf="!isSmallScreen">entries</span>
                </label>
              </div>
            </div>
            <div class="col ml--2 custom-flex-end-center">
              <!-- Search Input -->
              <div id="datatable_filter" class="dataTables_filter">
                <label>
                  <input *ngIf="!isSmallScreen || isInputVisible" type="search" class="form-control form-control-sm"
                    placeholder="Search records" aria-controls="datatable" (input)="filterTable($event)" />
                  <i *ngIf="isSmallScreen && !isInputVisible" class="fas fa-search" (click)="toggleSearchInput()"></i>
                </label>
              </div>
              <div role="menuitem" *ngIf="isRadXRole || isCompanyRole" id="datatable_filter"
                class="dataTables_filter mr-2">
                <!-- Filter Dropdown Button -->
                <div class="btn-group" dropdown>
                  <button id="button-basic" dropdownToggle type="button" class="btn btn-outline-primary dropdown-toggle"
                    aria-controls="dropdown-basic">
                    <span *ngIf="!isSmallScreen">Filters</span>
                    <span class="caret"></span>
                  </button>
                  <ul id="dropdown-basic" *dropdownMenu class="dropdown-menu dropdown-menu-right p-3" role="menu"
                    aria-labelledby="button-basic">


                    <!-- Dropdown for Company (if applicable) -->
                    <li role="menuitem" *ngIf="isRadXRole">
                      <label for="companySelect" class="dropdown-item">Company</label>
                      <select id="companySelect" [(ngModel)]="selectedCompany" class="form-control"
                        (change)="getTaxes()" (click)="$event.stopPropagation()">
                        <option value="">All Companies</option>
                        <option *ngFor="let company of companies" [value]="company.company_id">{{ company.company_name
                          }}</option>
                      </select>
                    </li>

                    <!-- Dropdown for User Group (if applicable) -->
                    <li role="menuitem" *ngIf="isRadXRole || isCompanyRole">
                      <label for="userGroupSelect" class="dropdown-item">User Group</label>

                      <!-- Dropdown for RadX Roles -->
                      <select *ngIf="isRadXRole" id="userGroupSelect" [(ngModel)]="selectedUserGroup"
                        class="form-control" (change)="getTaxes()" (click)="$event.stopPropagation()">
                        <option value="">All User Groups</option>
                        <option *ngFor="let userGroup of userGroups" [value]="userGroup.usergr_id">{{
                          userGroup.usergr_name }}</option>
                      </select>

                      <!-- Dropdown for Company Roles -->
                      <select *ngIf="isCompanyRole" id="userGroupSelect" [(ngModel)]="selectedUserGroup"
                        class="form-control" (change)="getTaxesByCompany()" (click)="$event.stopPropagation()">
                        <option value="">All User Groups</option>
                        <option *ngFor="let userGroup of userGroups" [value]="userGroup.usergr_id">{{
                          userGroup.usergr_name }}</option>
                      </select>
                    </li>

                  </ul>
                </div>
              </div>
            </div>

          </div>

              <ng-template ngx-datatable-cell-template let-row="row">

                <button type="button" class=" btn btn-sm btn-neutral" tooltip="Delete"

          <div class="scrollable-table">
            <ngx-datatable id="print-section" class="bootstrap selection-cell" [columnMode]="'force'"
              [headerHeight]="50" [footerHeight]="50" [rowHeight]="'auto'" [limit]="entries != -1 ? entries : undefined"
              [rows]="temp" [selected]="selected" [selectionType]="'multiClick'" (activate)="onActivate($event)"
              (select)="onSelect($event)">

              <ngx-datatable-column name="No.">
                <ng-template ngx-datatable-cell-template let-rowIndex="rowIndex">
                  {{ rowIndex + 1 }}
                </ng-template>
              </ngx-datatable-column>

              <ngx-datatable-column name="Tax Name" prop="tax_name"></ngx-datatable-column>
              <ngx-datatable-column *ngIf="!isSmallScreen" name="Percentage" prop="percentage"></ngx-datatable-column>
              <ngx-datatable-column *ngIf="!isSmallScreen" name="Tax Identification Number"
                prop="taxIdentificationNumber"></ngx-datatable-column>
              <ngx-datatable-column *ngIf="!isSmallScreen" name="Created By" prop="madeBy"></ngx-datatable-column>
              <ngx-datatable-column *ngIf="!isSmallScreen" name="Modified By" prop="modifiedBy"></ngx-datatable-column>

              <ngx-datatable-column *ngIf="!isCompanyAnalyst" name="Actions" prop="actions">
                <ng-template ngx-datatable-cell-template let-row="row">
                  <button type="button" class="btn btn-sm btn-neutral" tooltip="Edit"
                    [routerLink]="['/rates/radxupdatetaxes/', row.tax_id]"><i class="fas fa-edit"></i></button>
                  <button type="button" class="btn btn-sm btn-neutral" tooltip="Delete"
                    [routerLink]="['/rates/radxdeletetaxes/', row.tax_id]"><i class="fas fa-trash-alt"></i></button>
                </ng-template>
              </ngx-datatable-column>

            </ngx-datatable>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
