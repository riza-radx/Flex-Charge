<div class="header bg-danger pb-6" style="background-color: #931623 !important">
    <div class="container-fluid">
        <div class="header-body">
            <div class="row align-items-center py-4">
            </div>
        </div>
    </div>
</div>

<div class="container-fluid mt--6">
    <div class="row">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0">Use Voucher</h3>
                </div>
                <div class="card-body">
                    <form #voucherForm="ngForm" (ngSubmit)="onSubmit()" novalidate>
                        <div class="form-group row">
                            <label class="col-md-2 col-form-label form-control-label" for="blockNo">
                                Block Number
                            </label>
                            <div class="col-md-10">
                                <input 
                                    class="form-control" 
                                    id="blockNo" 
                                    [(ngModel)]="voucher.blockNo" 
                                    name="blockNo" 
                                    required />
                                <small
                                    *ngIf="voucherForm.controls.blockNo?.invalid && (voucherForm.controls.blockNo?.touched || voucherForm.submitted)"
                                    class="text-danger">
                                    Block Number is required.
                                </small>
                            </div>
                        </div>

                        <div class="form-group row">
                            <div class="col-md-10 offset-md-2">
                                <button 
                                    class="btn btn-primary" 
                                    type="submit" 
                                    [disabled]="voucherForm.invalid">
                                    Use Voucher
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
