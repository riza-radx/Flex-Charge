<!-- Header Section -->
<div class="header pb-6 d-flex align-items-center"
    style="min-height: 120px; background-size: cover; background-position: center top; background-color: #931623 !important;">
    <span class="mask"></span>
    <div class="container-fluid d-flex align-items-center">
        <div class="row">
            <div class="col">
                <h2 class="text-white mb-0">Create Promo Notifications</h2>
            </div>
        </div>
    </div>
</div>

<!-- Body Section -->
<div class="container-fluid mt--6">
    <div class="row">
        <div class="col-xl-12 order-xl-1">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3 class="mb-0">Promo Notifications</h3>
                </div>

                <div class="card-body">
                    <form (ngSubmit)="onSubmit()" [formGroup]="notificationForm">

                        <div formArrayName="notifications">
                            <div *ngFor="let notif of notifications.controls; let i = index" [formGroupName]="i"
                                class="border p-3 mb-3 rounded">

                                <div class="row mb-3">
                                    <div class="col-md-2">
                                        <label>Step</label>
                                        <select class="form-control" formControlName="step_count">
                                            <option value="">Select Step</option>
                                            <option *ngFor="let step of steps" [value]="step">{{ step }}</option>
                                        </select>
                                    </div>

                                    <div class="col-md-4">
                                        <label>Title</label>
                                        <input type="text" class="form-control" formControlName="title"
                                            placeholder="Enter notification title">
                                    </div>

                                    <div class="col-md-5">
                                        <label>Body</label>
                                        <textarea rows="2" class="form-control" formControlName="body"
                                            placeholder="Enter notification message"></textarea>
                                    </div>

                                    <div class="col-md-1 d-flex align-items-end justify-content-end">
                                        <button type="button" class="btn btn-danger btn-sm"
                                            (click)="removeNotification(i)">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <button type="button" class="btn btn-sm btn-neutral" (click)="addNotification()">
                                <i class="fas fa-plus"></i> Add New Notification
                            </button>
                        </div>

                        <div class="text-right mt-4">
                            <button type="submit" class="btn btn-primary" [disabled]="notificationForm.invalid">
                                <i class="fas fa-save"></i> Submit Notifications
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
