<!-- Header Section -->
<div class="header pb-6 d-flex align-items-center"
  style="min-height: 120px;background-size: cover;background-position: center top; background-color: #931623 !important">
  <span class="mask "></span>
  <div class="container-fluid d-flex align-items-center">
    <div class="row">
    </div>
  </div>
</div>

<div class="container-fluid mt--6">
  <div class="row">
    <div class="col">
      <div class="card">
        <div class="dataTables_wrapper py-4">
          <div class="card-header">
            <div class="row">
              <div class="col-9">
                <h3 class="mb-0">Station Status</h3>
              </div>
            </div>
          </div>
        </div>

        <div class="dataTables_wrapper py-4">
          <div class="row align-items-center">
            <div class="col ml--2 custom-flex-end-center">
              <div id="datatable_filter" class="dataTables_filter">
                <label>
                  <input *ngIf="!isSmallScreen || isInputVisible" type="search" class="form-control form-control-sm"
                    placeholder="Search records" aria-controls="datatable" (input)="filterTable($event)" />
                  <i *ngIf="isSmallScreen && !isInputVisible" class="fas fa-search" (click)="toggleSearchInput()"></i>
                </label>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="card-deck flex-column flex-m-row col-md-12 mb-10" *ngFor="let location of filteredLocations">
              <div class="card">
                <div class="card-body">
                  <ul class="list-group list-group-flush list my--3">
                    <li class="list-group-item px-0">
                      <div class="row align-items-center">
                        <div class="col-auto">
                          <a class="avatar rounded-circle" href="javascript:void(0)">
                            <img alt="Image placeholder" src="assets/img/stations/car-charging-station.jpg" />
                          </a>
                        </div>
                        <div class="col ml--2">
                          <h4 class="mb-0"> {{ location.location_name }} - {{ location.noOfChargers }} chargers</h4>
                          <small> {{ location.address }} </small>
                        </div>
                        <div class="col-auto" *ngIf="location.noOfChargers > 0">
                          <a *ngIf="!isSmallScreen" [routerLink]="['/monitoring/stationStatus', location.location_id]"
                            class="btn btn-primary">View Details</a>
                          <i *ngIf="isSmallScreen" class="fas fa-eye"
                            [routerLink]="['/monitoring/stationStatus', location.location_id]"></i>
                        </div>
                      </div>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>

    


        </div>
      </div>
    </div>
  </div>
</div>
